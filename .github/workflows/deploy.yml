# CI/CD for the Dokploy demo.
#
#   push to main ──► test ──► build image once (tag = commit SHA)
#                          ──► retag :staging   ──► Dokploy deploys staging ──► smoke test
#                          ──► manual approval  (GitHub "production" environment)
#                          ──► retag :production ──► Dokploy deploys production ──► smoke test
#
# The SAME image digest goes to both environments. Only the variables
# stored in Dokploy differ, so nothing is edited on any VPS.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   secrets.DOKPLOY_TOKEN              API key from Dokploy (Profile → API/CLI)
#   vars.DOKPLOY_URL                   e.g. https://dokploy.example.com
#   vars.DOKPLOY_STAGING_APP_ID        applicationId of the staging service
#   vars.DOKPLOY_PRODUCTION_APP_ID     applicationId of the production service
#   vars.STAGING_URL                   e.g. https://staging.demo.example.com
#   vars.PRODUCTION_URL                e.g. https://demo.example.com
# And in Settings → Environments: create "staging" and "production";
# give "production" a required reviewer to get the manual approval gate.

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: app
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/thesis-demo" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to :staging
        run: |
          docker buildx imagetools create \
            -t "${{ needs.build.outputs.image }}:staging" \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Trigger Dokploy deploy (staging)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ vars.DOKPLOY_STAGING_APP_ID }}
        run: ./scripts/dokploy-deploy.sh

      - name: Smoke test staging
        run: ./scripts/smoke-test.sh "${{ vars.STAGING_URL }}" staging "${{ needs.build.outputs.version }}"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production          # required reviewer here = manual approval
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the same image to :production
        run: |
          docker buildx imagetools create \
            -t "${{ needs.build.outputs.image }}:production" \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Trigger Dokploy deploy (production)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ vars.DOKPLOY_PRODUCTION_APP_ID }}
        run: ./scripts/dokploy-deploy.sh

      - name: Smoke test production
        run: ./scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}" production "${{ needs.build.outputs.version }}"
